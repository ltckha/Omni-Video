<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Omni Video Curator</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #1a1a1a;
      color: #ffffff;
    }
    h3 {
      margin-top: 0;
      color: #ff5722;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #aaaaaa;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #ff5722;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #e64a19;
    }
    .info-box {
      background: #262626;
      border-left: 3px solid #ff5722;
      padding: 8px;
      font-size: 11px;
      color: #ccc;
      margin-top: 14px;
      line-height: 1.4;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      color: #4caf50;
      display: none;
    }
  </style>
</head>
<body>
  <h3>📸 Omni Shopee Curator</h3>
  
  <div class="form-group">
    <label for="webhookUrl">Google Apps Script Web App URL:</label>
    <input type="text" id="webhookUrl" placeholder="https://script.google.com/macros/s/.../exec">
  </div>
  
  <button id="saveBtn">Lưu Cấu Hình</button>
  <div id="status" class="status">✓ Đã lưu cài đặt!</div>

  <div class="info-box">
    <strong>💡 Hướng dẫn sử dụng:</strong><br>
    1. Mở trang sản phẩm Shopee bất kỳ.<br>
    2. Rê chuột lên ảnh sản phẩm nét nhất.<br>
    3. Nhấn phím tắt <strong>Alt + S</strong> (hoặc chuột phải chọn "Lưu ảnh SP").<br>
    4. Ảnh sẽ lưu vào <code>Product_Assets/&lt;Mã_SP&gt;/</code> và đồng bộ Google Sheet!
  </div>

  <script src="popup.js"></script>
</body>
</html>
