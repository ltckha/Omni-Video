<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Omni Video Curator</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #1a1a1a;
      color: #ffffff;
    }
    h3 {
      margin-top: 0;
      color: #ff5722;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-box {
      background: #262626;
      border-left: 3px solid #ff5722;
      padding: 8px;
      font-size: 11px;
      color: #ccc;
      margin-top: 0;
      line-height: 1.4;
    }
    h4 {
      margin: 16px 0 8px;
      font-size: 13px;
      color: #ff5722;
    }
    .flow-status {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .flow-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #333;
      font-size: 11px;
    }
    .flow-item span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .flow-item button {
      background: #ff5722;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
    }
    #flowList {
      max-height: 260px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h3>📸 Omni Shopee Curator</h3>
  
  <div class="info-box">
    <strong>💡 Hướng dẫn sử dụng:</strong><br>
    1. Mở trang sản phẩm Shopee bất kỳ.<br>
    2. Rê chuột lên ảnh sản phẩm nét nhất.<br>
    3. Nhấn phím tắt <strong>Alt + S</strong> (hoặc chuột phải chọn "Lưu ảnh SP").<br>
    4. Ảnh sẽ lưu vào <code>Product_Assets/&lt;Mã_SP&gt;/</code> và đồng bộ Google Sheet!
  </div>

  <h4>🎬 Tạo video trên Google Flow</h4>
  <div class="flow-status" id="flowStatus">Đang tải danh sách…</div>
  <div id="flowList"></div>

  <script src="popup.js"></script>

</body>
</html>
